name: Atlas validation

on:
  push:
    branches: [rebuild/kiltikonet-institution-2026-09]
    paths:
      - '.github/workflows/atlas-validation.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/rebuild*.py'
      - 'docs/rebuild/ATLAS_SCREEN_INDEX.json'
      - 'docs/rebuild/ATLAS_SCREEN_MATRIX.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-validation.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/rebuild*.py'
      - 'docs/rebuild/ATLAS_SCREEN_INDEX.json'
      - 'docs/rebuild/ATLAS_SCREEN_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare result directory
        run: mkdir -p "$RUNNER_TEMP/atlas-results"
      - name: Check Atlas source contract and generated inventory
        run: |
          python scripts/rebuild_inventory.py
          git diff --exit-code -- docs/rebuild/ROUTE_API_INVENTORY.json frontend/src/config/routeInventory.json
          python scripts/rebuild_atlas.py
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- --format json --output-file "$RUNNER_TEMP/atlas-results/lint.json"
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand --json --outputFile="$RUNNER_TEMP/atlas-results/frontend-tests.json"
      - name: Build frontend
        working-directory: frontend
        env:
          # Existing lint warnings remain visible; lint errors fail the prior step.
          CI: 'false'
        run: npm run build
      - name: Smoke test the produced shell and assets
        run: python scripts/rebuild_http_smoke.py --output "$RUNNER_TEMP/atlas-results/http-smoke.json"
      - name: Retain frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-frontend-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-results/
          retention-days: 7

  network-observatory:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-atlas.txt
      - name: Prepare result directory
        run: mkdir -p "$RUNNER_TEMP/atlas-results"
      - name: Install route-harness dependencies
        run: python -m pip install -r backend/requirements-atlas.txt
      - name: Install the pinned MongoDB test binary
        run: |
          curl --fail --location --retry 2 --max-time 180 https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          printf '%s  %s\n' b4cf8caae108785135ecc8b86ad8ed6df5d6efb84b9b95a50ecba2fc246ce084 "$RUNNER_TEMP/mongodb.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$RUNNER_TEMP"
          echo "MONGOD_BINARY=$RUNNER_TEMP/mongodb-linux-x86_64-ubuntu2204-7.0.14/bin/mongod" >> "$GITHUB_ENV"
      - name: Lint Python critical errors
        run: python -m flake8 backend/routes/network.py backend/routes/observatory.py backend/tests/test_rebuild_authorization.py backend/tests/test_rebuild_network_observatory.py scripts/rebuild*.py --select=E9,F63,F7,F82 --show-source
      - name: Test authorization dependencies
        run: python -m pytest backend/tests/test_rebuild_authorization.py -q --junitxml="$RUNNER_TEMP/atlas-results/authorization.xml"
      - name: Test real MongoDB and signed sessions
        run: |
          test -x "$MONGOD_BINARY"
          python -m pytest backend/tests/test_rebuild_network_observatory.py -q --junitxml="$RUNNER_TEMP/atlas-results/network-observatory.xml"
      - name: Retain backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-backend-${{ github.sha }}
          path: ${{ runner.temp }}/atlas-results/
          retention-days: 7
